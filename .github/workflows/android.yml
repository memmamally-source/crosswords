# Builds the Android app (mobile/) on GitHub's computers.
#
# - On a pull request that changes the app or the site: checks it builds.
# - Run it by hand (Actions → Android app → Run workflow) to get files to
#   download: an APK to install on a phone for testing, and the signed
#   bundle (.aab) to upload to Google Play.
#
# Signing uses four repository secrets (Settings → Secrets and variables →
# Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the bundle is
# built unsigned. See mobile/README.md.
name: Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'puzzles/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the site into the app
        run: node copy-web.js && npx cap sync android

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key in the repository secrets: the bundle will be unsigned."
          fi

      - name: Build
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }}

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: crossword-hub-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
